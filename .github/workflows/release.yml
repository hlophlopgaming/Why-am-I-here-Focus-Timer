name: Release extension
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version and tests
        run: |
          version=$(node -p "require('./manifest.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          node --test tests/*.test.cjs
      - name: Build extension
        run: |
          mkdir -p dist
          zip -r "dist/why-am-i-here-$GITHUB_REF_NAME.xpi" manifest.json background.js content.js core.js i18n.js options.html options.css options.js sound.js icons sounds
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.xpi --generate-notes
